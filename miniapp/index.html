  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Keel is a BTC-backed dollar account on Mezo: borrow MUSD without selling your Bitcoin, get protected from liquidation automatically, and send, split and claim payments, in Telegram or in your browser." />
    <link rel="canonical" href="https://keel-miniapp.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keel" />
    <meta property="og:title" content="Keel · Borrow against your Bitcoin, spend it in Telegram" />
    <meta property="og:description" content="MUSD loans on Mezo with automatic liquidation protection and payments anyone can receive. Non-custodial. Live on Mezo testnet." />
    <meta property="og:url" content="https://keel-miniapp.vercel.app/" />
    <meta property="og:image" content="https://keel-miniapp.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keel: Borrow against your Bitcoin. Spend it in Telegram." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keel · Borrow against your Bitcoin, spend it in Telegram" />
    <meta name="twitter:description" content="MUSD loans on Mezo with automatic liquidation protection and payments anyone can receive." />

    <link rel="icon" type="image/svg+xml" href="/keel-icon-red.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/keel-icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <!-- The Telegram SDK is loaded by src/main.tsx only when the app (not the landing page) is opened. -->
    <script>
      // Same rule as src/main.tsx: a plain browser at "/" gets the (prerendered) landing page; everything else is the app.
      (function () {
        var h = location.hash, q = location.search, tg = /tgWebApp/.test(h + q) || "TelegramWebviewProxy" in window
        try { tg = tg || /tgWebAppData/.test(sessionStorage.getItem("__telegram__initParams") || "") } catch (e) {}
        var landing = !tg && location.pathname === "/" && (h === "" || h === "#" || h === "#/about") && !/[?&](w|demo|mock)=/.test(q)
        document.documentElement.setAttribute("data-mode", landing ? "landing" : "app")
        var css = "__LANDING_CSS__", js = "__LANDING_JS__"
        if (landing && css.indexOf("__") !== 0) {
          document.write('<link rel="stylesheet" href="' + css + '" />')
          // fetch the landing's code alongside the entry instead of after it
          js.split(",").forEach(function (f) { document.write('<link rel="modulepreload" crossorigin href="' + f + '" />') })
        }
      })()
    </script>
    <style>html,body{background:#ffffff;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}html[data-mode=app] #root>.lp{display:none}</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Keel needs JavaScript. Open <a href="https://t.me/KeelMezoBot/app">Keel in Telegram</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
