# Every 6 hours: re-bake the public stats snapshot used by the static pages while the backend sleeps.
# A changed snapshot is committed, which makes Vercel redeploy the site with fresh numbers.
name: refresh-snapshot
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node miniapp/scripts/snapshot-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "keel-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/stats-snapshot.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Refresh stats snapshot" && git push; fi
